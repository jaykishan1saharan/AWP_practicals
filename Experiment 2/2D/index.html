<!DOCTYPE html>
<html>
<head>
    <title>Moving Train</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Moving Train</h1>

    <div id="train">🚂🚃🚃🚃🚂</div>

    <div class="controls">
        <label>Enter Time (seconds):</label>

        <input type="number" id="timeInput" min="1" placeholder="Enter seconds">

        <button id="startBtn">Start</button>
        <button id="stopBtn">Stop</button>

        <p id="status">Enter time and click Start</p>
    </div>

    <script src="script.js"></script>

</body>
</html>
