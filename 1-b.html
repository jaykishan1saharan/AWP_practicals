<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>E-Commerce Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container-fluid">
        <div class="row">

            <!-- Sidebar -->
            <div class="col-md-2 sidebar p-3">

                <h4 class="text-center text-white">Dashboard</h4>

                <ul class="nav flex-column mt-4">

                    <li><a href="#" class="nav-link text-white">🏠 Home</a></li>
                    <li><a href="#" class="nav-link text-white">📦 Orders</a></li>
                    <li><a href="#" class="nav-link text-white">🛒 Products</a></li>
                    <li><a href="#" class="nav-link text-white">👥 Customers</a></li>
                    <li><a href="#" class="nav-link text-white">⚙ Settings</a></li>

                </ul>

            </div>

            <!-- Main Content -->

            <div class="col-md-10 p-4">

                <h2>E-Commerce Dashboard</h2>

                <div class="row text-center my-4">

                    <div class="col-md-3">
                        <div class="card bg-primary text-white">
                            <div class="card-body">
                                <h5>Orders</h5>
                                <h3>150</h3>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-3">
                        <div class="card bg-success text-white">
                            <div class="card-body">
                                <h5>Customers</h5>
                                <h3>85</h3>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-3">
                        <div class="card bg-warning text-dark">
                            <div class="card-body">
                                <h5>Products</h5>
                                <h3>120</h3>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-3">
                        <div class="card bg-danger text-white">
                            <div class="card-body">
                                <h5>Revenue</h5>
                                <h3>₹5 Lakh</h3>
                            </div>
                        </div>
                    </div>

                </div>

                <h4>Recent Orders</h4>

                <table class="table table-bordered table-hover">

                    <tr class="table-dark">
                        <th>ID</th>
                        <th>Customer</th>
                        <th>Product</th>
                        <th>Status</th>
                    </tr>

                    <tr>
                        <td>101</td>
                        <td>Rahul</td>
                        <td>Laptop</td>
                        <td>Delivered</td>
                    </tr>

                    <tr>
                        <td>102</td>
                        <td>Priya</td>
                        <td>Headphones</td>
                        <td>Pending</td>
                    </tr>

                    <tr>
                        <td>103</td>
                        <td>Amit</td>
                        <td>Keyboard</td>
                        <td>Shipped</td>
                    </tr>

                </table>

            </div>

        </div>
    </div>

</body>

</html>
