<!DOCTYPE html>
<html>

<head>
    <title>College Registration</title>
    <link rel="stylesheet" href="1-d.css">
</head>

<body>

    <div class="box">

        <h2>College Registration</h2>

        <form id="form">

            Name:<br>
            <input type="text" id="name" required><br><br>

            Roll No:<br>
            <input type="text" id="roll" required><br><br>

            Branch:<br>
            <select id="branch">
                <option>CSE</option>
                <option>IT</option>
                <option>ECE</option>
            </select><br><br>

            Password:<br>
            <input type="password" id="password" required><br><br>

            <button type="submit">Register</button>

        </form>

        <div id="output"></div>

    </div>

    <script src="1-d.js"></script>

</body>

</html>
